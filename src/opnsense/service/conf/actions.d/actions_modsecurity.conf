#
# The page's questions and its Apply, and Apache as a service. errors:no on the scripts that answer the
# page: each prints a JSON answer and exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/modsecurity/status.py
parameters:
errors:no
type:script_output
message:reading the Web Application Firewall's status

# The page's Apply and the boot's: the configuration written, tested by Apache, and Apache started,
# reloaded or stopped by it. Its description offers it to System: Settings: Cron and to an ACME client's
# automation, which can run it once a certificate is renewed (the daily cron.d entry takes one within a day).
[apply]
command:/usr/local/opnsense/scripts/modsecurity/setup.py apply
parameters:
errors:no
type:script_output
message:applying the Web Application Firewall's settings
description:Apply the Web Application Firewall's settings

# Settings' Install: the newest signed release of the Core Rule Set's 4.25 line, then Apply where the
# plugin is on.
[crs.install]
command:/usr/local/opnsense/scripts/modsecurity/crs.py install
parameters:
errors:no
type:script_output
message:installing the OWASP Core Rule Set
description:Install the newest signed release of the OWASP Core Rule Set for the Web Application Firewall

# Apache, for System: Services. The "one" prefix tells rc.subr to do as it is asked: whether it runs is
# decided by the setting in config.xml (plugins.inc.d/modsecurity.inc starts it at boot), not by rc.conf.
[start]
command:/usr/local/etc/rc.d/modsecurity onestart
parameters:
type:script
message:starting the Web Application Firewall

[stop]
command:/usr/local/etc/rc.d/modsecurity onestop
parameters:
type:script
message:stopping the Web Application Firewall

[restart]
command:/usr/local/etc/rc.d/modsecurity onerestart
parameters:
type:script
message:restarting the Web Application Firewall
