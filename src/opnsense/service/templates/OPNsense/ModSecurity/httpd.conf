{#
 # SPDX-License-Identifier: BSD-2-Clause
 # Copyright (c) 2026 Abdelmonem Awad <eg2@live.com>
 #
 # The Web Application Firewall's own Apache: the sites of its Sites tab, each received on this
 # firewall, inspected by ModSecurity with the OWASP Core Rule Set and passed to its backend.
 # scripts/modsecurity/setup.py renders this into /usr/local/etc/os-modsecurity/httpd.conf at each
 # Apply, with Jinja2 as configd renders OPNsense's own, and has Apache test it before Apache reads it.
 # configd does not render it, and this folder has no +TARGETS: what it holds - the addresses of the
 # interfaces chosen as they are now, the certificates exported from System: Trust, the Core Rule
 # Set's installed version, which sites passed their checks - is no setting of config.xml alone.
 #
 # Every value comes from setup.py checked (common.py): host names, URLs, paths and numbers only, so
 # none can carry a second directive.
 #
 #   modules, mpm, security2   [{name, path}] each LoadModule, the MPM, ModSecurity's module
 #   listen                    [{text, proto}] each address and port, "http" or "https"
 #   http_port, https_port     the ports listened on, or None
 #   default_cert              {crt, key} for the HTTPS catch-all: the first site's with a certificate
 #   sites                     [{uuid, rule, servername, aliases, rx, engine, paranoia, http
 #                             (serve, redirect or None), https, crt, key, url, tls_backend, verify,
 #                             https_suffix}]
 #   crs, etc, run, logs, pidfile, rotatelogs, trust   the paths - crs the Core Rule Set's own
 #                             directory, crs/<version>, never crs/current: a configuration put back keeps
 #                             the rules it ran with
 #}
# Written by the Web Application Firewall (os-modsecurity) at each Apply - change its pages, not this
# file: it is written again. Apache runs it as its own instance, never the apache24 package's.
ServerRoot "/usr/local"
DefaultRuntimeDir "{{ run }}"
PidFile "{{ pidfile }}"

LoadModule {{ mpm.name }} {{ mpm.path }}
{% for module in modules %}
LoadModule {{ module.name }} {{ module.path }}
{% endfor %}
LoadModule security2_module {{ security2 }}

ServerName localhost
User www
Group www
ServerTokens Prod
ServerSignature Off
TraceEnable Off
DocumentRoot "/var/empty"
<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

# Apache's own messages, a file a day beside the audit log's; nothing a request at a time. Warnings and
# worse, and the MPM's notices, which say when a start or a graceful restart is done ("resuming normal
# operations"): what Apply waits for after a reload.
ErrorLog "|{{ rotatelogs }} -l -f {{ logs }}/error_%Y%m%d.log 86400"
LogLevel warn mpm_{{ mpm.kind }}:notice

# No kernel accept filter is asked for: Apache takes each connection as it comes.
AcceptFilter http none
AcceptFilter https none
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
# A request read within bounds (mod_reqtimeout): the TLS handshake in 5 seconds, the headers in 20 - up to
# 40 while 500 bytes a second come - and the body at 500 bytes a second after its first 20 seconds; else
# 408 and the worker is free. Without it a client sending a header line a minute keeps a worker as long as
# it likes, and a hundred of them stop every site: ModSecurity sees nothing before the headers end.
RequestReadTimeout handshake=5 header=20-40,MinRate=500 body=20,MinRate=500

{% if mpm.kind == 'prefork' %}
StartServers 2
MinSpareServers 2
MaxSpareServers 5
ServerLimit 64
MaxRequestWorkers 64
{% else %}
StartServers 1
ServerLimit 4
ThreadsPerChild 25
MaxRequestWorkers 100
MinSpareThreads 25
MaxSpareThreads 75
{% endif %}
MaxConnectionsPerChild 0

# A reverse proxy only: never a forward one.
ProxyRequests Off
ProxyVia Off

{% if https_port %}
# TLS as Mozilla's intermediate profile has it: 1.2 and 1.3, forward secrecy, no session tickets.
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache "shmcb:{{ run }}/ssl_scache(512000)"
SSLSessionCacheTimeout 300
{% endif %}

{% for item in listen %}
Listen {{ item.text }} {{ item.proto }}
{% endfor %}

# ModSecurity, then the Core Rule Set as its documentation orders it: its setup, its plugins'
# configuration and what they run before it, its rules, what they run after it.
Include "{{ etc }}/modsecurity.conf"
Include "{{ crs }}/crs-setup.conf"

# Each site's paranoia level (settled point 6), set before the Core Rule Set's own start sets level 1
# where none is (rule 901120): by the host name of the request, the one Apache chose the site's virtual
# host by. No name is in two sites, so one rule at most matches. Rules 19001 to 19899 are this plugin's.
{% for site in sites %}
SecRule SERVER_NAME "@rx {{ site.rx }}" "id:{{ site.rule }},phase:1,pass,nolog,t:none,t:lowercase,setvar:tx.blocking_paranoia_level={{ site.paranoia }},skipAfter:OS_MODSECURITY_SITES"
{% endfor %}
SecMarker OS_MODSECURITY_SITES

IncludeOptional "{{ crs }}/plugins/*-config.conf"
IncludeOptional "{{ crs }}/plugins/*-before.conf"
Include "{{ crs }}/rules/*.conf"
IncludeOptional "{{ crs }}/plugins/*-after.conf"

# A request for a name no site has meets these first virtual hosts of each port: refused, and not
# inspected.
{% if http_port %}
<VirtualHost *:{{ http_port }}>
    ServerName unknown.invalid
    SecRuleEngine Off
    <Location "/">
        Require all denied
    </Location>
</VirtualHost>
{% endif %}
{% if https_port %}
<VirtualHost *:{{ https_port }}>
    ServerName unknown.invalid
    SSLEngine on
    SSLCertificateFile "{{ default_cert.crt }}"
    SSLCertificateKeyFile "{{ default_cert.key }}"
    SecRuleEngine Off
    <Location "/">
        Require all denied
    </Location>
</VirtualHost>
{% endif %}
{% for site in sites %}

# site {{ site.uuid }}: {{ site.servername }}{% if site.aliases %} {{ site.aliases|join(' ') }}{% endif %}, paranoia level {{ site.paranoia }}, {{ site.engine }}
{% if site.http == 'serve' %}
<VirtualHost *:{{ http_port }}>
    ServerName {{ site.servername }}
{% if site.aliases %}
    ServerAlias {{ site.aliases|join(' ') }}
{% endif %}
    SecRuleEngine {{ site.engine }}
    ProxyPreserveHost On
{% if site.tls_backend %}
    SSLProxyEngine on
{% if site.verify %}
    SSLProxyVerify require
    SSLProxyVerifyDepth 10
    SSLProxyCACertificateFile "{{ trust }}"
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on
{% else %}
    SSLProxyVerify none
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
{% endif %}
{% endif %}
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass "/" "{{ site.url }}"
    ProxyPassReverse "/" "{{ site.url }}"
</VirtualHost>
{% elif site.http == 'redirect' %}
<VirtualHost *:{{ http_port }}>
    ServerName {{ site.servername }}
{% if site.aliases %}
    ServerAlias {{ site.aliases|join(' ') }}
{% endif %}
    SecRuleEngine {{ site.engine }}
    RewriteEngine On
    RewriteRule "^" "https://%{SERVER_NAME}{{ site.https_suffix }}%{REQUEST_URI}" [R=301,L]
</VirtualHost>
{% endif %}
{% if site.https %}
<VirtualHost *:{{ https_port }}>
    ServerName {{ site.servername }}
{% if site.aliases %}
    ServerAlias {{ site.aliases|join(' ') }}
{% endif %}
    SSLEngine on
    SSLCertificateFile "{{ site.crt }}"
    SSLCertificateKeyFile "{{ site.key }}"
    SecRuleEngine {{ site.engine }}
    ProxyPreserveHost On
{% if site.tls_backend %}
    SSLProxyEngine on
{% if site.verify %}
    SSLProxyVerify require
    SSLProxyVerifyDepth 10
    SSLProxyCACertificateFile "{{ trust }}"
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on
{% else %}
    SSLProxyVerify none
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
{% endif %}
{% endif %}
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/" "{{ site.url }}"
    ProxyPassReverse "/" "{{ site.url }}"
</VirtualHost>
{% endif %}
{% endfor %}
