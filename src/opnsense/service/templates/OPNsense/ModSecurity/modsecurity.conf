{#
 # SPDX-License-Identifier: BSD-2-Clause
 # Copyright (c) 2026 Abdelmonem Awad <eg2@live.com>
 #
 # ModSecurity's own settings for the Web Application Firewall, included by httpd.conf before the
 # Core Rule Set. scripts/modsecurity/setup.py renders it into /usr/local/etc/os-modsecurity/ at each
 # Apply, as it renders httpd.conf. ModSecurity's recommended settings (its modsecurity.conf-recommended)
 # where a reverse proxy needs them, as phase 0's lab ran them on the second XGS 3300, and three changes:
 # the audit log in JSON (settled point 7a, which that lab measured accepted), a file a day; the parts
 # of a transaction it keeps without the request's body or uploaded files; the headers that carry
 # credentials masked in it.
 #
 #   work, logs, rotatelogs    the paths
 #}
# Written by the Web Application Firewall (os-modsecurity) at each Apply - change its pages, not this
# file: it is written again.

# Off here: each site's virtual host turns it on, in Detection only or Blocking (settled point 5), and a
# request for a name no site has is not inspected.
SecRuleEngine Off

# Request bodies are inspected, up to 12.5 MiB with files and 128 KiB without; a larger one is refused
# where its site blocks.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
# Responses are passed as they come, unread, as phase 0's lab ran it: the Core Rule Set's rules on what
# a site sends back do not run.
SecResponseBodyAccess Off

SecTmpDir "{{ work }}/tmp/"
SecDataDir "{{ work }}/data/"

# A transaction that matched a rule, or was refused or failed (a status of 5xx, or 4xx but 404): its
# record, one JSON object a line, in a file a day.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog "|{{ rotatelogs }} -l -f {{ logs }}/audit_%Y%m%d.log 86400"

SecArgumentSeparator &
SecCookieFormat 0
# Nothing is reported to ModSecurity's makers.
SecStatusEngine Off

# What carries a password or a session is masked in the audit log, where it holds the request's and the
# response's headers (parts B and F); a rule's own message (part H) can still quote a value it matched.
# Rule 19000 is this plugin's.
SecAction "id:19000,phase:1,pass,nolog,t:none,sanitiseRequestHeader:Authorization,sanitiseRequestHeader:Proxy-Authorization,sanitiseRequestHeader:Cookie,sanitiseResponseHeader:Set-Cookie"
